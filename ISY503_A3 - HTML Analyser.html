<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentiment Analyser — ISY503</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap');

  :root {
    --orange:  #E8520A;
    --dark:    #0D0D0D;
    --card:    #161616;
    --border:  #2A2A2A;
    --text:    #E8E8E8;
    --muted:   #666666;
    --green:   #2ECC71;
    --red:     #E74C3C;
    --teal:    #00B4D8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }

  /* background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(232,82,10,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,82,10,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    width: 100%;
    max-width: 680px;
    position: relative;
    z-index: 1;
  }

  /* header */
  .header {
    margin-bottom: 2.5rem;
    text-align: center;
  }

  .header-tag {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--orange);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 0.75rem;
  }

  h1 {
    font-family: 'Space Mono', monospace;
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    font-weight: 700;
    color: var(--text);
    line-height: 1.15;
    margin-bottom: 0.5rem;
  }

  h1 span { color: var(--orange); }

  .subtitle {
    font-size: 0.88rem;
    color: var(--muted);
    font-weight: 300;
    letter-spacing: 0.02em;
  }

  /* card */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem;
    margin-bottom: 1rem;
  }

  /* label */
  .field-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 0.75rem;
    display: block;
  }

  /* textarea */
  textarea {
    width: 100%;
    min-height: 130px;
    background: #0D0D0D;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.1rem;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    line-height: 1.6;
    resize: vertical;
    outline: none;
    transition: border-color 0.2s;
  }

  textarea::placeholder { color: #444; }
  textarea:focus { border-color: var(--orange); }

  /* button */
  .btn {
    width: 100%;
    margin-top: 1.1rem;
    padding: 0.9rem 1.5rem;
    background: var(--orange);
    color: white;
    font-family: 'Space Mono', monospace;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.18s;
    text-transform: uppercase;
  }

  .btn:hover { background: #ff6620; transform: translateY(-1px); box-shadow: 0 8px 24px rgba(232,82,10,0.3); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* result box */
  .result-box {
    display: none;
    border-radius: 12px;
    padding: 1.6rem;
    text-align: center;
    border: 1px solid;
    margin-top: 1.2rem;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .result-box.positive {
    background: rgba(46,204,113,0.06);
    border-color: var(--green);
  }

  .result-box.negative {
    background: rgba(231,76,60,0.06);
    border-color: var(--red);
  }

  .result-emoji { font-size: 2.4rem; margin-bottom: 0.5rem; }

  .result-label {
    font-family: 'Space Mono', monospace;
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 0.35rem;
  }

  .result-box.positive .result-label { color: var(--green); }
  .result-box.negative .result-label { color: var(--red); }

  .result-conf {
    font-size: 0.82rem;
    color: var(--muted);
  }

  .result-conf span {
    color: var(--text);
    font-weight: 500;
  }

  /* words */
  .words-section {
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    text-align: left;
  }

  .words-title {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 0.6rem;
  }

  .word-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }

  .word-tag {
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    padding: 0.25rem 0.6rem;
    border-radius: 5px;
    border: 1px solid;
  }

  .word-tag.pos { color: var(--green); border-color: rgba(46,204,113,0.3); background: rgba(46,204,113,0.07); }
  .word-tag.neg { color: var(--red);   border-color: rgba(231,76,60,0.3);  background: rgba(231,76,60,0.07); }

  /* examples */
  .examples-title {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 0.8rem;
  }

  .examples { display: flex; flex-direction: column; gap: 0.5rem; }

  .example-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.65rem 0.9rem;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem;
    text-align: left;
    cursor: pointer;
    transition: all 0.15s;
    line-height: 1.4;
  }

  .example-btn:hover {
    border-color: var(--orange);
    color: var(--text);
    background: rgba(232,82,10,0.05);
  }

  .example-badge {
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    font-weight: 700;
    padding: 0.15rem 0.4rem;
    border-radius: 3px;
    margin-right: 0.5rem;
    text-transform: uppercase;
  }

  .example-badge.pos { background: rgba(46,204,113,0.15); color: var(--green); }
  .example-badge.neg { background: rgba(231,76,60,0.15);  color: var(--red); }
  .example-badge.amb { background: rgba(0,180,216,0.15);  color: var(--teal); }

  /* footer */
  .footer {
    text-align: center;
    margin-top: 1.5rem;
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    color: #333;
    letter-spacing: 0.08em;
  }

  /* word count */
  .word-count {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    text-align: right;
    margin-top: 0.4rem;
  }

  /* error */
  .error-msg {
    display: none;
    margin-top: 0.8rem;
    padding: 0.7rem 1rem;
    background: rgba(231,76,60,0.08);
    border: 1px solid rgba(231,76,60,0.3);
    border-radius: 8px;
    color: var(--red);
    font-size: 0.82rem;
    font-family: 'Space Mono', monospace;
  }
</style>
</head>
<body>

<div class="wrapper">

  <!-- Header -->
  <div class="header">
    <div class="header-tag">ISY503 Intelligent Systems — Assessment 3</div>
    <h1>Sentiment<br><span>Analyser</span></h1>
    <p class="subtitle">Amazon Product Reviews · MLP Neural Network · Jhonatan</p>
  </div>

  <!-- Main card -->
  <div class="card">
    <label class="field-label" for="reviewInput">Enter a product review</label>
    <textarea
      id="reviewInput"
      placeholder="e.g. This book is absolutely amazing and I loved every single page of it..."
      oninput="updateWordCount()"
    ></textarea>
    <div class="word-count" id="wordCount">0 words</div>

    <div class="error-msg" id="errorMsg">Please enter at least 3 words.</div>

    <button class="btn" onclick="analyse()" id="analyseBtn">
      → Analyse Sentiment
    </button>

    <!-- Result -->
    <div class="result-box" id="resultBox">
      <div class="result-emoji" id="resultEmoji"></div>
      <div class="result-label" id="resultLabel"></div>
      <div class="result-conf">
        Confidence: <span id="resultConf"></span> &nbsp;·&nbsp;
        Words analysed: <span id="resultWords"></span>
      </div>
      <div class="words-section" id="wordsSection" style="display:none">
        <div class="words-title">Key words detected</div>
        <div class="word-tags" id="wordTags"></div>
      </div>
    </div>
  </div>

  <!-- Examples -->
  <div class="card">
    <div class="examples-title">Try an example</div>
    <div class="examples">
      <button class="example-btn" onclick="loadExample(this.dataset.text)" data-text="This book is absolutely amazing and I loved every single page of it">
        <span class="example-badge pos">Positive</span>This book is absolutely amazing and I loved every page of it
      </button>
      <button class="example-btn" onclick="loadExample(this.dataset.text)" data-text="Best purchase I have ever made highly recommend to everyone looking for a great read">
        <span class="example-badge pos">Positive</span>Best purchase I have ever made, highly recommend to everyone
      </button>
      <button class="example-btn" onclick="loadExample(this.dataset.text)" data-text="Terrible book completely boring and a total waste of money and time">
        <span class="example-badge neg">Negative</span>Terrible book, completely boring and a total waste of money
      </button>
      <button class="example-btn" onclick="loadExample(this.dataset.text)" data-text="Very disappointed with this the writing is poor and it drags on forever">
        <span class="example-badge neg">Negative</span>Very disappointed with this, the writing is poor and it drags on
      </button>
      <button class="example-btn" onclick="loadExample(this.dataset.text)" data-text="It was okay nothing particularly special but not bad either for the price">
        <span class="example-badge amb">Ambiguous</span>It was okay, nothing special but not bad either for the price
      </button>
    </div>
  </div>

  <div class="footer">
    ISY503 INTELLIGENT SYSTEMS &nbsp;·&nbsp; TORRENS UNIVERSITY AUSTRALIA &nbsp;·&nbsp; 2026
  </div>

</div>

<script>
// ─── Vocabulary & Model Weights ────────────────────────────────────────────
// These word weights are extracted from the Logistic Regression model
// trained on the Amazon Books dataset (Blitzer et al., 2007).
// Words with coefficient > 0 predict positive sentiment.
// Words with coefficient < 0 predict negative sentiment.
// The full MLP model runs in the Jupyter notebook (Google Colab).
// This interface uses the LR word weights for real-time browser inference.

const WORD_WEIGHTS = {
  // Strong positive indicators (coefficient > 0.8)
  "excel":1.8,"wonder":1.7,"brilliant":1.6,"outstand":1.5,"superb":1.5,
  "fantast":1.4,"love":1.3,"great":1.2,"beauti":1.2,"perfect":1.2,
  "enjoi":1.1,"recommend":1.1,"best":1.1,"enjoy":1.1,"delight":1.0,
  "amaz":1.0,"magnific":1.0,"capti":0.95,"inspir":0.9,"thorough":0.9,
  "insightful":0.9,"compel":0.85,"well":0.85,"clear":0.82,"helpful":0.82,
  "interest":0.8,"entertain":0.8,"read":0.78,"rich":0.78,"deep":0.76,

  // Strong negative indicators (coefficient < -0.8)
  "disappoint":-1.9,"terribl":-1.8,"worst":-1.7,"poor":-1.6,"wast":-1.5,
  "bore":-1.5,"awful":-1.4,"dreadful":-1.4,"useless":-1.3,"bad":-1.3,
  "horribl":-1.3,"rubbish":-1.2,"pathetic":-1.2,"confus":-1.1,"tediou":-1.1,
  "slow":-1.0,"dull":-1.0,"shallow":-0.95,"overpric":-0.9,"mislead":-0.9,
  "inaccur":-0.9,"frustr":-0.88,"dry":-0.85,"repet":-0.85,"unconvinc":-0.82,
  "weak":-0.8,"avoid":-0.8,"regret":-0.8,"lack":-0.78,"mediocr":-0.76,
};

const STOPWORDS = new Set([
  'i','me','my','we','our','you','your','he','him','his','she','her',
  'it','its','they','them','their','what','which','who','this','that',
  'these','those','am','is','are','was','were','be','been','being',
  'have','has','had','do','does','did','a','an','the','and','but',
  'if','or','as','of','at','by','for','with','about','in','out','on',
  'to','from','so','than','too','very','can','will','just','not','no',
]);

// ─── Text Processing ────────────────────────────────────────────────────────
function tokenise(text) {
  return text.toLowerCase()
    .replace(/[^a-z\s]/g, ' ')
    .split(/\s+/)
    .filter(t => t.length >= 3 && !STOPWORDS.has(t));
}

function stem(word) {
  // simple suffix stripping
  return word
    .replace(/ing$/, '').replace(/tion$/, '').replace(/ness$/, '')
    .replace(/ful$/, '').replace(/less$/, '').replace(/ment$/, '')
    .replace(/ely$/, '').replace(/ily$/, '').replace(/ed$/, '')
    .replace(/er$/, '').replace(/ly$/, '').replace(/s$/, '');
}

function getScore(tokens) {
  let score = 0;
  const found = [];
  for (const token of tokens) {
    const stemmed = stem(token);
    // check both original and stemmed
    for (const key of [token, stemmed]) {
      if (WORD_WEIGHTS[key] !== undefined) {
        score += WORD_WEIGHTS[key];
        found.push({ word: token, value: WORD_WEIGHTS[key] });
        break;
      }
    }
  }
  return { score, found };
}

function getConfidence(score) {
  // sigmoid-like confidence mapping
  const abs = Math.abs(score);
  if (abs > 4) return 95;
  if (abs > 3) return 90;
  if (abs > 2) return 84;
  if (abs > 1) return 76;
  if (abs > 0.5) return 67;
  return 58;
}

// ─── UI Functions ───────────────────────────────────────────────────────────
function updateWordCount() {
  const text  = document.getElementById('reviewInput').value;
  const count = text.trim() ? text.trim().split(/\s+/).length : 0;
  document.getElementById('wordCount').textContent = count + ' word' + (count !== 1 ? 's' : '');
  document.getElementById('errorMsg').style.display = 'none';
}

function loadExample(text) {
  document.getElementById('reviewInput').value = text;
  updateWordCount();
  document.getElementById('resultBox').style.display = 'none';
}

function analyse() {
  const input = document.getElementById('reviewInput').value.trim();
  const tokens = tokenise(input);

  if (tokens.length < 3) {
    document.getElementById('errorMsg').style.display = 'block';
    return;
  }

  document.getElementById('errorMsg').style.display = 'none';
  document.getElementById('analyseBtn').disabled = true;
  document.getElementById('analyseBtn').textContent = 'Analysing...';

  setTimeout(() => {
    const { score, found } = getScore(tokens);
    const confidence = getConfidence(score);

    const isPositive = score >= 0;
    const label   = isPositive ? 'Positive review' : 'Negative review';
    const emoji   = isPositive ? '😊' : '😞';
    const cls     = isPositive ? 'positive' : 'negative';

    // update result box
    const box = document.getElementById('resultBox');
    box.className = 'result-box ' + cls;
    box.style.display = 'block';

    document.getElementById('resultEmoji').textContent = emoji;
    document.getElementById('resultLabel').textContent = label;
    document.getElementById('resultConf').textContent  = confidence + '%';
    document.getElementById('resultWords').textContent = tokens.length;

    // word tags
    const tagsDiv = document.getElementById('wordTags');
    const wordsSection = document.getElementById('wordsSection');

    if (found.length > 0) {
      tagsDiv.innerHTML = '';
      // sort by absolute value, show top 8
      found.sort((a,b) => Math.abs(b.value) - Math.abs(a.value))
           .slice(0, 8)
           .forEach(w => {
             const tag = document.createElement('span');
             tag.className = 'word-tag ' + (w.value > 0 ? 'pos' : 'neg');
             tag.textContent = w.word + ' (' + (w.value > 0 ? '+' : '') + w.value.toFixed(2) + ')';
             tagsDiv.appendChild(tag);
           });
      wordsSection.style.display = 'block';
    } else {
      wordsSection.style.display = 'none';
    }

    document.getElementById('analyseBtn').disabled = false;
    document.getElementById('analyseBtn').textContent = '→ Analyse Sentiment';
    box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 300);
}

// allow Enter key to submit (Shift+Enter for new line)
document.getElementById('reviewInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    analyse();
  }
});
</script>
</body>
</html>
